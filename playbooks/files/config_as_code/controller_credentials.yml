---
controller_credential_types:
  - name: AD Domain Secrets
    description: Injects the AD safe mode and domain Administrator passwords as extra vars
    kind: cloud
    inputs:
      fields:
        - id: domain_admin_password
          type: string
          label: Domain Administrator / DSRM password
          secret: true
      required:
        - domain_admin_password
    injectors:
      extra_vars:
        safe_mode_password: !unsafe "{{ domain_admin_password }}"
        domain_admin_password: !unsafe "{{ domain_admin_password }}"

controller_credentials:

  - name: "{{ my_aws_credential }}"
    description: AWS credential used to provision/terminate the demo EC2 instances
    organization: "{{ my_organization }}"
    credential_type: Amazon Web Services
    inputs:
      username: "{{ aws_access_key }}"
      password: "{{ aws_secret_key }}"

  # Build-phase identity: network/instance provisioning, role install, both
  # dcpromo operations. Always the built-in local "Administrator" account -
  # see roles/dc_instances/scripts/aws_userdata for why.
  - name: "{{ my_build_credential }}"
    description: Windows connection credential for provisioning and promotion job templates
    organization: "{{ my_organization }}"
    credential_type: Machine
    inputs:
      username: Administrator
      password: "{{ dc_admin_password }}"
      become_method: runas
      become_username: administrator

  # Operate-phase identity: DNS/DHCP/DFS/FSMO day-2 job templates. Resolves to
  # the exact same domain Administrator account as the build credential above -
  # deliberately kept as a separate AAP credential object so it can be scoped
  # to a different team/role grant (see controller_teams_roles.yml) and
  # rotated or revoked independently of build-phase access.
  - name: "{{ my_ops_credential }}"
    description: Windows connection credential for DNS/DHCP/DFS/FSMO job templates
    organization: "{{ my_organization }}"
    credential_type: Machine
    inputs:
      # Domain-qualified: steps 06-10 run after promotion and some of them
      # (DFS) reach a second DC on the connecting user's behalf. A bare
      # "Administrator" gets delegated as a local account and fails with
      # a logon error (1326).
      username: "{{ my_domain_netbios_name }}\\Administrator"
      password: "{{ dc_admin_password }}"
      become_method: runas
      become_username: administrator

  # Supplies safe_mode_password and domain_admin_password to the promotion
  # job templates as extra vars at run time. Both resolve to the same value as
  # the built-in Administrator password (see roles/dc_instances/scripts/aws_userdata),
  # so there is no secrets file in this repo at all - the only copy lives in AAP.
  - name: "{{ my_domain_secrets_credential }}"
    description: DSRM (safe mode) and domain Administrator password for dcpromo
    organization: "{{ my_organization }}"
    credential_type: AD Domain Secrets
    inputs:
      domain_admin_password: "{{ dc_admin_password }}"
