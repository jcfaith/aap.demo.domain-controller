---
dc_region: "{{ network_region }}"
dc_subnet_name: "{{ network_subnet_name }}"
dc_security_group_name: "{{ network_security_group_name }}"
dc_instance_type: m5.xlarge
dc_assign_public_ip: true
dc_alwaysup: false
dc_deleteby: service.ansible
dc_ec2_ansible_group: service.ansible
dc_my_email_address: "{{ network_my_email_address }}"
# Source of truth for the AMI id - always resolves to the latest published
# Windows Server 2022 base image in the target region, never hardcoded.
dc_ami_ssm_path: /aws/service/ami-windows-latest/Windows_Server-2022-English-Full-Base
dc_hosts:
  - name: dc01
    role: dc01
    private_ip: 10.60.0.10
  - name: dc02
    role: dc02
    private_ip: 10.60.0.11
